<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Мои заметки</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <h1>Мои заметки</h1>

        <form id="noteForm" onsubmit="return false;">
            <textarea id="noteInput" placeholder="Новая заметка..." rows="1" cols="50"></textarea>
            <button id="addButton">Добавить</button>
        </form>

        <ul id="notesList"></ul>

        <div id="rulesContainer">
            <p>Пожалуйста, ознакомьтесь с <a href="..//html/tips.html">правилами использования</a>, которые рекомендуют специалисты, чтобы понять, как правильно вести заметки.</p>
        </div>

        <a href="settings.html" id="settingsLink">
            <img src="..//images/settings.png" alt="Настройки" style="width: 50px; height: 50px;">
        </a>

        <button id="scrollUpButton">
            <img src="..//images/scrollUp.png" alt="Прокрутить вверх" style="width: 40px; height: 40px;">
        </button>

        <button id="scrollDownButton">
            <img src="..//images/scrollDown.png" alt="Прокрутить вниз" style="width: 40px; height: 40px;">
        </button>

        <script src="../js/script.js"></script>
    </body>
</html>
