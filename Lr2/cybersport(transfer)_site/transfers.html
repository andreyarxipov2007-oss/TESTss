        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0e1a; color: #fff; }
        .header-menu {
            display: flex; justify-content: space-between; align-items: center;

            background: #1a1f2e; border-radius: 20px; padding: 20px; margin-bottom: 20px;
        }
        .transfer-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid #2a2f3e;
        }
        footer { background: #0f1420; text-align: center; padding: 20px; margin-top: 40px; color: #888; }
        .btn-up {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            border-radius: 50%; background: #ff6b00; color: white; border: none;
            font-size: 24px; cursor: pointer; display: none;
        }
        @media (max-width: 768px) {
            .header-menu { flex-direction: column; gap: 15px; }
            .player-profile { flex-direction: column; align-items: center; text-align: center; }
        }
