    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0e1a; color: #fff; }
        .header-menu {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f1420; padding: 15px 30px; border-bottom: 2px solid #ff6b00;
            flex-wrap: wrap;
        }
        .logo a { font-size: 24px; font-weight: bold; color: #ff6b00; text-decoration: none; }
        .nav-links { display: flex; gap: 10px; }
        .link a {
            display: block; padding: 8px 16px; color: #fff; text-decoration: none;
            border-radius: 8px; transition: 0.3s;
        }
        .link a:hover { background: #ff6b00; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        .player-profile {
            background: #1a1f2e; border-radius: 20px; padding: 30px;
            display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 30px;
        }
        .player-photo {
            flex: 0 0 200px;
        }
        .player-photo img {
            width: 100%; border-radius: 50%; border: 4px solid #ff6b00;
        }
        .player-info { flex: 1; }
        .player-name { font-size: 36px; color: #ff6b00; margin-bottom: 10px; }
        .player-team { font-size: 20px; margin-bottom: 10px; }
        .player-role { background: #2a2f3e; display: inline-block; padding: 5px 15px; border-radius: 20px; margin-bottom: 20px; }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px; margin-top: 20px;
        }
        .stat-card {
            background: #0f1420; padding: 15px; border-radius: 10px; text-align: center;
        }
        .stat-value { font-size: 28px; font-weight: bold; color: #ff6b00; }
        .stat-label { font-size: 12px; color: #aaa; }
        .transfer-history, .achievements {
            background: #1a1f2e; border-radius: 20px; padding: 20px; margin-bottom: 20px;
        }
        .transfer-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid #2a2f3e;
        }
        footer { background: #0f1420; text-align: center; padding: 20px; margin-top: 40px; color: #888; }
        .btn-up {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            border-radius: 50%; background: #ff6b00; color: white; border: none;
            font-size: 24px; cursor: pointer; display: none;
        }
        @media (max-width: 768px) {
            .header-menu { flex-direction: column; gap: 15px; }
            .player-profile { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>

    function getPlayerId() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');}

    function renderPlayer(playerId) {
        const player = playersData[playerId];
        const container = document.getElementById('playerContainer');
        if (!player) {
            container.innerHTML = '<div style="background:#1a1f2e; padding:40px; text-align:center; border-radius:20px;"><h2>Игрок не найден</h2><a href="index.html">Вернуться на главную</a></div>';
            return;
        }

        // Статистика зависит от игры
        let statsHtml = '';
        if (player.game === 'CS2') {
            statsHtml = `
                <div class="stat-card"><div class="stat-value">${player.kd}</div><div class="stat-label">K/D Ratio</div></div>
                <div class="stat-card"><div class="stat-value">${player.headshots}%</div><div class="stat-label">Headshots</div></div>
                <div class="stat-card"><div class="stat-value">$${player.prize.toLocaleString()}</div><div class="stat-label">Призовые</div></div>
            `;
        } else {
            statsHtml = `
                <div class="stat-card"><div class="stat-value">${player.kda}</div><div class="stat-label">KDA</div></div>
                <div class="stat-card"><div class="stat-value">${player.avgGpm}</div><div class="stat-label">GPM</div></div>
                <div class="stat-card"><div class="stat-value">$${player.prize.toLocaleString()}</div><div class="stat-label">Призовые</div></div>
            `;
        }

        // История трансферов
        let transfersHtml = '';
        if (player.transfers && player.transfers.length > 0) {
            transfersHtml = '<h3>История трансферов</h3>';
            player.transfers.forEach(t => {
                transfersHtml += `
                    <div class="transfer-item">
                        <span>${t.from} → ${t.to}</span>
                        <span>${t.year}</span>
                        <span style="color:#ff6b00;">${t.fee}</span>
                    </div>
                `;
            });
        } else {
            transfersHtml = '<p>Нет данных о трансферах</p>';
        }

        // Достижения
        let achievementsHtml = '<ul style="margin-left:20px;">';
        player.achievements.forEach(ach => {
            achievementsHtml += `<li>🏆 ${ach}</li>`;
        });
        achievementsHtml += '</ul>';

        const html = `
            <div class="player-profile">
                <div class="player-photo">
                    <img src="${player.photo}" alt="${player.name}" onerror="this.src='img/logo'">
                </div>
                <div class="player-info">
                    <div class="player-name">${player.name}</div>
                    <div class="player-team">Команда: <a href="${player.teamPage}" style="color:#ff6b00;">${player.team}</a></div>
                    <div class="player-role">${player.game} • ${player.role}</div>
                    <div class="stats-grid">${statsHtml}</div>
                </div>
            </div>
            <div class="transfer-history">
                ${transfersHtml}
            </div>
            <div class="achievements">
                <h3>🏅 Достижения</h3>
                ${achievementsHtml}
            </div>
        `;
        container.innerHTML = html;
    }

    // Кнопка наверх
    let btn = document.getElementById('btnUp');
    window.addEventListener('scroll', () => { btn.style.display = window.scrollY > 300 ? 'block' : 'none'; });
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    const playerId = getPlayerId();
    if (playerId) {
        renderPlayer(playerId);
    } else {
        document.getElementById('playerContainer').innerHTML = '<div style="background:#1a1f2e; padding:40px; text-align:center;">Не указан ID игрока</div>';
